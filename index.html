<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing Game</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <button id="settings-btn" class="settings-btn">
        <i class="fas fa-cog"></i> Gear
    </button>
    <div id="settings" class="settings">
        <form id="settings-form">
            <div>
                <label for="difficulty">Difficulty</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </form>
    </div>

    <div class="container">
        <h2>👨‍💻 Speed Typing</h2>
        <small>Type the following:</small>

        <h1 id="word"></h1>

        <input 
            type="text" 
            id="text" 
            autocomplete="off" 
            placeholder="Type the word here..."
        />

        <p class="time-container">
            Time left: <span id="time">10s</span>
        </p>

        <p class="score-container">
            Score: <span id="score">0</span>
        </p>

        <div id="end-game-container" class="end-game-container">
            <h2>Time ran out</h2>
            <p>Your final score is <span id="final-score">0</span></p>
            <button onclick="location.reload()">Reload</button>
        </div>
    </div>

</body>

</html>
